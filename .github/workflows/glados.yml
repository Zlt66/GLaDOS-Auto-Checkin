name: GLaDOS Auto Checkin

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 4 * * *'   # 每日 UTC 4 点签到（北京时间 12 点）
    - cron: '0 0 1 * *'   # 每月 1 号保活空提交

jobs:
  checkin:
    name: GLaDOS 签到
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name != 'schedule' || github.event.schedule != '0 0 1 * *'
    concurrency:
      group: glados-checkin
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          pip install --no-cache-dir patchright
          patchright install --with-deps chromium

      - name: Run checkin (browser + Turnstile)
        run: xvfb-run -a --server-args="-screen 0 1366x900x24" python checkin_browser.py
        env:
          COOKIES: ${{ secrets.COOKIES || vars.COOKIES }}
          SENDKEY: ${{ secrets.SENDKEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          WECOM_BOT_WEBHOOK: ${{ secrets.WECOM_BOT_WEBHOOK }}
          YUNHU_TOKEN: ${{ secrets.YUNHU_TOKEN }}
          YUNHU_RECV_ID: ${{ secrets.YUNHU_RECV_ID }}
          YUNHU_RECV_TYPE: ${{ secrets.YUNHU_RECV_TYPE }}
          # #9 积分兑换计划（可选；不配置则默认不兑换，不影响现有签到）
          EXCHANGE_PLAN: ${{ secrets.EXCHANGE_PLAN }}
          GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
          # 浏览器版参数：0=有头(配 xvfb)，1=无头
          HEADLESS: "0"
          DEBUG_SHOT: "1"
          ACCOUNT_DELAY: "4"

      - name: Upload debug screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

  keepalive:
    name: 每月空提交保活
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: glados-keepalive
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 创建空提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive to prevent workflow suspension"
          git push
